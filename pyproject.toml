[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motor-expansao"
version = "0.1.0"
description = "Motor de Expansão Ativa — Ultra Academia"
requires-python = ">=3.11"

# Dependencias minimas: dashboard Streamlit + pipelines essenciais.
# API, PostGIS, Prefect e scraping ficam nos extras abaixo.
dependencies = [
    # Dashboard
    "streamlit>=1.35.0,<2",
    "pandas>=2.2.0,<3",
    "pyarrow>=16.0.0,<24",
    "numpy>=1.26.0,<2.4",
    "openpyxl>=3.1.0",
    "plotly>=5.20.0",
    "pydeck>=0.8.1",
    # >=10.1: `ImageFont.load_default(size=)` (fonte TrueType embutida, escalavel) e usada
    # por `censo_map._font` desde o BLK-RELPON-06 — em 10.0.x levantaria TypeError no render.
    "pillow>=10.1",
    "fpdf2>=2.7.0,<3",

    # Geoespacial (pipeline M1 + camadas)
    "h3>=3.7.7",
    "geopandas>=0.14.4",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "geopy>=2.4.1",
    "openlocationcode>=1.0.1",  # BLK-UI-09-FU2: Plus Code (Open Location Code) na busca

    # Analise
    "matplotlib>=3.7.0",
    "scikit-learn>=1.5.0,<1.8",
    "scipy>=1.10.0,<2",  # camada de dimensionamento (goal-seek brentq do simulador)

    # Utilitarios
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10",
    "pytest-asyncio>=0.23.0,<0.25",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0,<4",
    "ruff>=0.15,<0.16",
    "mypy>=1.10.0,<2",
    # FIN-VIAB-01 (decisao de Felipe, 2026-07-24): RECALCULA de verdade as formulas
    # vivas do simulador XLSX nos testes. `openpyxl` nunca calcula nada, entao sem
    # este pacote o nivel 2 de `tests/unit/dimensionamento/test_simulador_xlsx.py`
    # (~4.293 formulas conferidas contra `simular()`) ficava SKIPPED via
    # `pytest.importorskip("formulas")` — planilha com formula errada passava no CI.
    # SO em [dev]: o Dockerfile instala sem [dev], entao nao entra na imagem publicada.
    "formulas>=1.2.0,<2",
]
# Subset MVP da API GeoEspacial on-demand (BLK-API-02+, §11 do contrato).
# Isolado do bloco `api` legado (PostGIS/Prefect/Sentry) — NAO arrastar aquele.
# Instalar: pip install -e ".[api_mvp]"
api_mvp = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
]
# (O extra do geocoder do bot — selenium/webdriver-manager — e o `geocoder`,
# definido abaixo junto de [basemap]; a imagem do bot usa .[basemap,api_mvp,geocoder].)
# Legado / fora do deploy Streamlit inicial
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "sentry-sdk[fastapi]>=2.3.0",
    "prefect>=2.19.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]
ml = [
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "joblib>=1.4.0",
    "pandera>=0.19.0",
]
scraping = [
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "fake-useragent>=1.5.0",
]
# Fundo de ruas (tiles online) SO na geracao do Relatorio Pontual Censitario.
# Fora das dependencias base do deploy: import lazy + fallback offline (DEC-004).
basemap = [
    "contextily>=1.5.0",
]
# Geocoder primario de endereco+CEP via Google Maps (Selenium) — api/maps_geocoder.py.
# Opcional por design: sem ele, geo.py cai no Nominatim (geopy ja esta na base).
# Import tardio + fallback gracioso; requer Google Chrome instalado no host.
geocoder = [
    "selenium>=4.20.0",
    "webdriver-manager>=4.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# `data/` nao e codigo-fonte: contem dados + scripts de reprodutibilidade de estudos
# (ex.: data/reports/estudo_escala_alunos/gerar_estudo.py). Fora do gate de lint.
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends(...)`/`Query(...)` em defaults de argumento e o idioma padrao do
# FastAPI (injecao de dependencia), nao um bug. Escopado so a camada da API.
"src/motor_expansao/api/**" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
packages = ["src/motor_expansao"]

[dependency-groups]
# Ferramenta de ESTACAO DE TRABALHO (grafo de conhecimento, §2/§7): serve o MCP declarado no
# `.mcp.json`. NAO roda no CI, nem nas imagens de producao (Dockerfile.streamlit/.api), nem no
# container do loop -- nenhum arquivo de src/, scripts/ ou tests/ faz `import graphify`.
# POR QUE [dependency-groups] (PEP 735) E NAO UM EXTRA: o comando canonico de refresh do lock
# (ci.yml:45, `uv pip compile pyproject.toml --all-extras ...`) NAO enxerga dependency-groups.
# MEDIDO em 2026-07-28: compilar com e sem este bloco devolve os MESMOS 214 pins, byte a byte;
# como extra, o mesmo comando devolve 250 (+36, dos quais 25 gramaticas tree-sitter). Logo o
# `constraints.txt` fica INTOCADO de proposito -- nao e' esquecimento.
# ATENCAO AO NOME: o pacote no PyPI e' `graphifyy`, com DOIS 'y'. O nome nu `graphify` esta
# UNCLAIMED no PyPI -- declara-lo abriria typosquatting.
# O PIN `mcp<2` E' OBRIGATORIO, NAO COSMETICO: o mcp 2.0.0 removeu `AnyUrl` de `mcp.types` e
# `graphify/serve.py:1116` ainda o importa; sem o pin o servidor sobe e morre com a mensagem
# ENGANOSA 'mcp not installed'. Medido 2026-07-28: mcp 2.0.0 = ImportError / mcp 1.29.0 =
# handshake OK com 10 tools. Reavaliar quando o graphify suportar mcp 2.x.
# Instalar: python -m pip install --group graph
graph = [
    "graphifyy[mcp]>=0.9.29,<0.10",
    "mcp>=1.28,<2",
]
