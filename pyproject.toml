[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motor-expansao"
version = "0.1.0"
description = "Motor de Expansão Ativa — Ultra Academia"
requires-python = ">=3.11"

# Dependencias minimas: dashboard Streamlit + pipelines essenciais.
# API, PostGIS, Prefect e scraping ficam nos extras abaixo.
dependencies = [
    # Dashboard
    "streamlit>=1.35.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "numpy>=1.26.0",
    "plotly>=5.20.0",
    "pydeck>=0.8.1",

    # Geoespacial (pipeline M1 + camadas)
    "h3>=3.7.7",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "geopy>=2.4.1",

    # Analise
    "scikit-learn>=1.5.0",

    # Utilitarios
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
# Legado / fora do deploy Streamlit inicial
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",
    "sentry-sdk[fastapi]>=2.3.0",
    "prefect>=2.19.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]
ml = [
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "joblib>=1.4.0",
    "pandera>=0.19.0",
]
scraping = [
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "fake-useragent>=1.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.hatch.build.targets.wheel]
only-include = [
    "config.py",
    "streamlit_app.py",
    "dashboard/",
    "hex_enrichment.py",
    "fase1_bi_exports.py",
    "base_h3_brasil.py",
    "jobs/",
    "scripts/",
]
