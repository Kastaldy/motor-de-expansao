[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motor-expansao"
version = "0.1.0"
description = "Motor de Expansão Ativa — Ultra Academia"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",

    # Banco
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",

    # Jobs / Pipelines
    "prefect>=2.19.0",
    "tenacity>=8.2.0",          # retry com backoff
    "structlog>=24.1.0",         # logs estruturados

    # Scraping
    "playwright>=1.44.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "fake-useragent>=1.5.0",

    # Geoespacial
    "h3>=3.7.7",
    "geopy>=2.4.1",
    "shapely>=2.0.4",
    "pyproj>=3.6.1",
    "folium>=0.16.0",            # visualização rápida de mapas

    # Dados
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.2",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",

    # ML
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "joblib>=1.4.0",

    # Validação de dados
    "pandera>=0.19.0",

    # Monitoramento
    "sentry-sdk[fastapi]>=2.3.0",

    # Utilitários
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",              # CLI para scripts
    "rich>=13.7.0",              # output bonito no terminal
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",             # test client FastAPI
    "factory-boy>=3.3.0",       # fixtures de dados
    "faker>=25.0.0",
    "ruff>=0.4.0",               # linter + formatter
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",         # notebooks exploratórios
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
omit = ["tests/*", "db/migrations/*", "scripts/*"]
