<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Ultra Academia</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Acesso restrito ao Motor de Expansão da Ultra Academia." />

    <!--
      PÁGINA PRÓPRIA, servida na RAIZ de `auth.ultra-expansao.tech`.

      Não é a SPA do piloto: ela tem entrada e assets próprios (`entrar-assets/`) porque
      divide o host com o portal do Authelia, e dois conjuntos de arquivos no mesmo
      endereço colidiriam. O Caddy manda só a raiz e esse prefixo para o nosso container;
      todo o resto daquele host continua indo para o Authelia — inclusive `/api/*`, que é
      o que faz o `fetch` desta página ser de MESMA ORIGEM, sem CORS.
    -->

    <!--
      Tema antes da primeira pintura, como no `index.html` do piloto.

      AQUI O COOKIE É A FONTE QUE IMPORTA, e não o `localStorage`. Esta página é servida de
      `auth.<dominio>` e o piloto de `piloto.<dominio>`: origens diferentes, `localStorage`
      diferentes. Até 2026-09-25 este trecho lia só `localStorage`, ou seja, a caixa de
      `auth.` — vazia, porque quem escolheu o tema escolheu no piloto. O resultado era a
      tela de entrar SEMPRE escura para quem havia pedido o claro, e o defeito não aparecia
      em desenvolvimento, onde as duas páginas saem do mesmo `localhost:5000`.

      O `localStorage` fica primeiro mesmo assim, para manter UMA ordem de leitura com
      `lerTema` e com o `index.html`: aqui ele simplesmente não tem valor, e o cookie
      responde. Ver o cabeçalho de `COOKIE_TEMA` em `src/lib/tema.ts`.
    -->
    <script>
      ;(function () {
        function valido(v) {
          return v === 'claro' || v === 'escuro' ? v : null
        }
        var t = null
        try {
          t = valido(localStorage.getItem('motor.tema'))
        } catch (e) {}
        if (!t) {
          try {
            var m = document.cookie.match(/(?:^|;\s*)motor\.tema=\s*([^;\s]+)/)
            t = m ? valido(m[1]) : null
          } catch (e) {}
        }
        if (!t) {
          try {
            t = valido(localStorage.getItem('motor.exec.tema'))
          } catch (e) {}
        }
        document.documentElement.setAttribute('data-tema', t || 'escuro')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entrar.tsx"></script>
  </body>
</html>
