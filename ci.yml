name: CI — Motor de Expansão

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ultra
          POSTGRES_PASSWORD: ultra123
          POSTGRES_DB: motor_expansao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://ultra:ultra123@localhost:5432/motor_expansao_test
      DATABASE_URL_SYNC: postgresql+psycopg2://ultra:ultra123@localhost:5432/motor_expansao_test
      ENVIRONMENT: test
      SECRET_KEY: chave-de-teste-nao-usar-em-producao
      H3_RESOLUTION: 8
      DIST_MIN_ULTRA_KM: 2.0
      RENDA_MIN: 3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -e ".[dev]"
      - name: Rodar testes
        run: pytest tests/unit tests/integration -v --cov-fail-under=70
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
