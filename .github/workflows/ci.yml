name: CI

on:
  push:
    branches: [main, codex-dashboard-m1-streamlit]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dispatch_build_sanity:
        description: "Buildar a imagem (SEM publicar) para sanity em branch de ciclo"
        type: boolean
        default: true
      publish_api:
        description: "Forcar build+publish da imagem da API/bot (motor-expansao-api) — bootstrap/manual"
        type: boolean
        default: false
      publish_web:
        description: "Forcar build+publish da imagem do piloto web (motor-expansao-web) — bootstrap/manual"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # BLK-ORQ-21: `test` vira required check com enforce_admins=true. Sem teto de tempo,
    # um job travado segura o portao pelo default de 6h e nenhum PR mergeia.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Instalar dependencias
        # inclui [api_mvp] (fastapi/uvicorn/pydantic) p/ a suite da API GeoEspacial
        # rodar no CI. NAO arrasta p/ a imagem: Dockerfile.streamlit usa .[basemap].
        # BLK-OPS-12: -c constraints.txt PINA todas as deps transitivas (lockfile
        # universal gerado por uv p/ >=3.11; mesmo arquivo usado nos Dockerfiles) ->
        # CI, imagens e local instalam as MESMAS versoes. Refresh do lock:
        #   uv pip compile pyproject.toml --all-extras --universal --python-version 3.11 -o constraints.txt
        run: pip install -e ".[dev,api_mvp]" -c constraints.txt

      # ruff/mypy sao steps de qualidade BLOQUEANTES desde BLK-OPS-02b: a divida
      # latente de lint/tipos (286 ruff + 23 mypy) foi zerada naquele ciclo, sem
      # alterar logica de scoring, artefatos M1 nem semantica de testes M1. A
      # partir daqui qualquer regressao de lint/tipos reprova o gate (CLAUDE.md
      # §2: nenhum PR sobe com CI quebrado).
      - name: Lint (ruff)
        run: ruff check . --no-cache

      - name: Types (mypy src/)
        run: mypy src/

      - name: Testes (suite completa)
        run: python -m pytest -q

      - name: Smoke import
        run: python -c "import streamlit_app; print('ok')"

      # BLK-SEC-02: gitleaks como gate BLOQUEANTE (qualquer segredo reprova o CI).
      # Reusa .gitleaks.toml/.gitleaksignore (BLK-OPS-01). Imagem pinada por digest.
      # SEVERIDADE: segredo nao tem tiers -> QUALQUER achado bloqueia (exit 1).
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --no-git --source . \
            --config .gitleaks.toml \
            --gitleaks-ignore-path .gitleaksignore \
            --redact --exit-code 1 --verbose

      # BLK-SEC-02: pip-audit sobre as deps do env do CI (desde BLK-OPS-12,
      # instaladas via constraints.txt -> audita exatamente o que roda em prod).
      # SEVERIDADE: bloqueia QUALQUER vuln nao-allowlistada; LOW/MEDIUM/dev/sem-fix
      # entram como --ignore-vuln GHSA-xxxx (cada um com justificativa + data revisao).
      # pip-audit instalado SO no CI (guardrail: worktree compartilha env, sem pip
      # install local) -> nao entra em [dev].
      # --skip-editable: o proprio projeto (`pip install -e .`, motor-expansao) nao
      # esta no PyPI e nao e auditavel; auditamos so as deps de terceiros. Sem
      # --strict (ele reprova o editavel skipado); pip-audit ja sai !=0 ao achar vuln.
      # ALLOWLIST (revisar ate 2026-09):
      #  - GHSA-6w46-j5rx-g56g (pytest<=9.0.2): DoS/priv-esc LOCAL via path previsivel
      #    /tmp/pytest-of-{user}. Dev/test only — pytest NAO entra na imagem de prod
      #    (Dockerfile.streamlit roda `pip install .` sem [dev]) -> zero exposicao em
      #    producao. Fix em pytest 9.0.3 (major 8->9) fica para bloco de migracao proprio.
      - name: Install pip-audit (CI only)
        # Upgrade do proprio pip p/ >=26.1.2 REMEDIA PYSEC-2026-196 (pip 26.1.1: entry
        # points instalados fora do dir de instalacao). Remediacao real (nao allowlist):
        # o pip-audit audita o env, que inclui o pip do runner.
        #
        # Idem setuptools >=83.0.0 (2026-07-14): REMEDIA PYSEC-2026-3447 (setuptools
        # 79.0.1 do runner; FileList aplicava as diretivas exclude do MANIFEST.in sem
        # normalizacao Unicode -> no macOS APFS/HFS+ um nome NFD escapava de uma regra
        # NFC e entrava na sdist). Vuln do ambiente do CI, nao de dep nossa: setuptools
        # NAO esta pinado no constraints.txt. Remediacao real, nao allowlist — mesmo
        # padrao do pip acima. Sobe DEPOIS do `pip install -e .`, entao nao altera o
        # que ja foi instalado nem a imagem de producao (step CI-only).
        run: |
          python -m pip install --upgrade "pip>=26.1.2" "setuptools>=83.0.0"
          pip install "pip-audit==2.7.3"
      - name: Dependency audit (pip-audit)
        run: pip-audit --desc --skip-editable --ignore-vuln GHSA-6w46-j5rx-g56g

  # ── Piloto web: typecheck + unit (Vitest) + build (WEB-16) ──────────────────
  # Gate de qualidade do FRONT do piloto, paralelo ao `test`. Toolchain Node (fora
  # do container Python do CI) — por isso job separado. Roda nos MESMOS gatilhos do
  # `test` (push nas branches acima, PR p/ main, workflow_dispatch). Node 20 = mesma
  # major do estagio Node do Dockerfile.web. READ-ONLY sobre o M1 (so front).
  # OBS de governanca: este job so vira REQUIRED CHECK quando o Felipe adiciona
  # `web` a protecao de branch (config do portao, ORQ-21) — o codigo aqui so o define.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # TODO(pin de governanca): fixar setup-node por SHA como os demais actions do
      # arquivo. @v4 e funcional; falta so a pinagem por digest (revisao do ci.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar deps (npm ci)
        run: npm ci
      - name: Testes unitarios (Vitest)
        run: npm run test
      - name: Typecheck + build (tsc --noEmit + vite build)
        run: npm run build

  # Gate de publicacao (BLK-SEC-01): a imagem so e publicada no GHCR quando o job
  # `test` conclui com sucesso (needs: [test]) E o gatilho e push na default branch.
  # Sem CI verde, este job (e seus steps de push) e pulado — fecha o gap do antigo
  # docker-publish.yml (que publicava a cada push em main SEM depender do CI).
  publish:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Login no GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}/motor-expansao-streamlit
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build (local, p/ scan antes do push)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.streamlit
          load: true
          tags: motor-expansao-streamlit:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BLK-SEC-04: muda a cada execucao -> a camada final de seguranca do Dockerfile
          # e' SEMPRE refeita. Sem isto o `cache-from: type=gha` congela os pacotes de SO
          # no estado da primeira vez que a camada foi cacheada e atualizacao de seguranca
          # nunca chega (foi o que prendeu o libexpat1 em 2.7.1-2 com o fix disponivel).
          # A camada vem DEPOIS do `pip install`, entao o build caro segue cacheado.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
      # BLK-SEC-02: Trivy bloqueia HIGH/CRITICAL antes do push (ignore-unfixed: nao
      # bloqueia CVE sem patch upstream -> controle de ruido). Imagem vulneravel NAO publica.
      - name: Image scan (Trivy, HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motor-expansao-streamlit:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore
      - name: Push (apos scan verde)
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.streamlit
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BLK-SEC-04: muda a cada execucao -> a camada final de seguranca do Dockerfile
          # e' SEMPRE refeita. Sem isto o `cache-from: type=gha` congela os pacotes de SO
          # no estado da primeira vez que a camada foi cacheada e atualizacao de seguranca
          # nunca chega (foi o que prendeu o libexpat1 em 2.7.1-2 com o fix disponivel).
          # A camada vem DEPOIS do `pip install`, entao o build caro segue cacheado.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
      - name: Exibir digest publicado (pin de prod)
        run: 'echo "Digest imutavel publicado: ${{ steps.push.outputs.digest }}"'

  # Sanity de build manual (workflow_dispatch em branch de ciclo): builda a imagem
  # SEM publicar (load: true, sem push). Nunca faz login no GHCR nem gera tag :latest.
  build-sanity:
    needs: [test]
    if: github.event_name == 'workflow_dispatch' && inputs.dispatch_build_sanity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build (sanity, load p/ scan)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.streamlit
          load: true
          tags: motor-expansao-streamlit:sanity
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BLK-SEC-04: muda a cada execucao -> a camada final de seguranca do Dockerfile
          # e' SEMPRE refeita. Sem isto o `cache-from: type=gha` congela os pacotes de SO
          # no estado da primeira vez que a camada foi cacheada e atualizacao de seguranca
          # nunca chega (foi o que prendeu o libexpat1 em 2.7.1-2 com o fix disponivel).
          # A camada vem DEPOIS do `pip install`, entao o build caro segue cacheado.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
      # BLK-SEC-02: mesmo gate de imagem do publish, aqui como sanity bloqueante
      # (decisao travada) -> build de ciclo com HIGH/CRITICAL reprova antes de virar prod.
      - name: Image scan (Trivy, HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motor-expansao-streamlit:sanity
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          trivyignores: .trivyignore

  # CD da imagem da API/bot: publica `motor-expansao-api` no GHCR p/ deploy por digest
  # (igual ao Streamlit). FILTRADO POR CAMINHO via git-diff: o build pesado (Google
  # Chrome) so roda quando mudam Dockerfile.api, src/.../api/** ou pyproject.toml; nos
  # demais pushes os steps pesados sao PULADOS (so checkout + filtro). Tambem roda via
  # workflow_dispatch (publish_api=true) p/ bootstrap/republish manual. needs: test.
  publish-api:
    needs: [test]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_api)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detectar mudancas que afetam a imagem da API
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "forcado por workflow_dispatch"; exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "sem base comparavel -> publica"; exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -qE '^(Dockerfile\.api|src/motor_expansao/api/|pyproject\.toml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "arquivos da API mudaram -> publica"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "nada da API mudou -> pula build"
          fi
      - name: Login no GHCR
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (tags/labels)
        id: meta
        if: steps.filter.outputs.changed == 'true'
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}/motor-expansao-api
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Buildx
        if: steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build (local, p/ scan antes do push)
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: motor-expansao-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BLK-SEC-04: muda a cada execucao -> a camada final de seguranca do Dockerfile
          # e' SEMPRE refeita. Sem isto o `cache-from: type=gha` congela os pacotes de SO
          # no estado da primeira vez que a camada foi cacheada e atualizacao de seguranca
          # nunca chega (foi o que prendeu o libexpat1 em 2.7.1-2 com o fix disponivel).
          # A camada vem DEPOIS do `pip install`, entao o build caro segue cacheado.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
      # Trivy em modo REPORT (exit-code 0) p/ a imagem da API: ela embute Google Chrome,
      # que carrega CVEs HIGH/CRITICAL perpetuas sem fix viavel (upstream fora do nosso
      # controle). Como a API NAO tem porta no host (so rede interna app_net), reportamos
      # sem bloquear — diferente do Streamlit (bloqueante). Revisar se for exposta publicamente.
      - name: Image scan (Trivy, REPORT-only)
        if: steps.filter.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motor-expansao-api:scan
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
      - name: Push (apos scan)
        id: push
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BLK-SEC-04: muda a cada execucao -> a camada final de seguranca do Dockerfile
          # e' SEMPRE refeita. Sem isto o `cache-from: type=gha` congela os pacotes de SO
          # no estado da primeira vez que a camada foi cacheada e atualizacao de seguranca
          # nunca chega (foi o que prendeu o libexpat1 em 2.7.1-2 com o fix disponivel).
          # A camada vem DEPOIS do `pip install`, entao o build caro segue cacheado.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
      - name: Exibir digest publicado (pin da API)
        if: steps.filter.outputs.changed == 'true'
        run: 'echo "API digest imutavel publicado: ${{ steps.push.outputs.digest }}"'

  # ── Publica a imagem do PILOTO WEB (motor-expansao-web) no GHCR ──────────────
  # Container unico: frontend Vite buildado (estagio Node) + backend FastAPI que serve
  # o SPA e a API. Path-filter cobre web/** E os modulos do motor que o backend importa
  # (dashboard/dimensionamento/api) — senao a imagem fica stale quando um deles muda
  # (mesmo gotcha do publish-api). Trivy BLOQUEANTE: exposto publicamente atras do
  # Authelia e sem Chrome (diferente da API). needs: test. Republish manual:
  #   gh workflow run ci.yml --ref main -f publish_web=true -f dispatch_build_sanity=false
  publish-web:
    needs: [test]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_web)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Detectar mudancas que afetam a imagem do web
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "forcado por workflow_dispatch"; exit 0
          fi
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "sem base comparavel -> publica"; exit 0
          fi
          if git diff --name-only "$BASE" "${{ github.sha }}" | grep -qE '^(Dockerfile\.web|web/|src/motor_expansao/(dashboard|dimensionamento|api)/|pyproject\.toml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; echo "arquivos do web mudaram -> publica"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "nada do web mudou -> pula build"
          fi
      - name: Login no GHCR
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata (tags/labels)
        id: meta
        if: steps.filter.outputs.changed == 'true'
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}/motor-expansao-web
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Set up Buildx
        if: steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Build (local, p/ scan antes do push)
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.web
          load: true
          tags: motor-expansao-web:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BLK-SEC-04: muda a cada execucao -> a camada final de seguranca do Dockerfile
          # e' SEMPRE refeita. Sem isto o `cache-from: type=gha` congela os pacotes de SO
          # no estado da primeira vez que a camada foi cacheada e atualizacao de seguranca
          # nunca chega (foi o que prendeu o libexpat1 em 2.7.1-2 com o fix disponivel).
          # A camada vem DEPOIS do `pip install`, entao o build caro segue cacheado.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
      # Trivy BLOQUEANTE (exit-code 1): o piloto e exposto publicamente (atras do Authelia)
      # e nao embute Chrome. HIGH/CRITICAL unfixed sao gate — igual ao Streamlit. Se travar
      # numa CVE sem fix viavel, adicionar ao .trivyignore com justificativa.
      - name: Image scan (Trivy, BLOQUEANTE)
        if: steps.filter.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: motor-expansao-web:scan
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
      - name: Push (apos scan)
        id: push
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BLK-SEC-04: muda a cada execucao -> a camada final de seguranca do Dockerfile
          # e' SEMPRE refeita. Sem isto o `cache-from: type=gha` congela os pacotes de SO
          # no estado da primeira vez que a camada foi cacheada e atualizacao de seguranca
          # nunca chega (foi o que prendeu o libexpat1 em 2.7.1-2 com o fix disponivel).
          # A camada vem DEPOIS do `pip install`, entao o build caro segue cacheado.
          build-args: |
            APT_REFRESH=${{ github.run_id }}
      - name: Exibir digest publicado (pin do web)
        if: steps.filter.outputs.changed == 'true'
        run: 'echo "WEB digest imutavel publicado: ${{ steps.push.outputs.digest }}"'
