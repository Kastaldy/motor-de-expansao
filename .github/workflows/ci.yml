name: CI

on:
  push:
    branches: [main, codex-dashboard-m1-streamlit]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Testes rapidos (dashboard + carteira)
        run: python -m pytest -q test_streamlit_app.py test_carteira_plano_nacional.py

      - name: Smoke import
        run: python -c "import streamlit_app; print('ok')"
