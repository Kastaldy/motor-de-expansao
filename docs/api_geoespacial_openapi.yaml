openapi: 3.1.0
info:
  title: API GeoEspacial - Motor de Expansao Ultra Academia
  description: >
    API complementar on-demand para estudos geoespaciais, consumida por bots de Telegram/WhatsApp.
    Esta spec cobre GET /health + POST /analisar (Relatorio Pontual Censitario 1.0 km); a API
    serve tambem GET /ufs, GET /municipios/{uf} e POST /analisar-municipio (Relatorio Municipal),
    fora desta spec (ver docs/api_geoespacial_contrato.md).
    READ-ONLY sobre o M1. Decisoes-chave aprovadas por Felipe Silva em 2026-06-10 (ver DEC-005).
    Origem do esboco: BLK-API-01 / G1; hoje implementado (BLK-API-02/03/04) e em producao.
  version: api-geoespacial/v1
servers:
  - url: /api/v1
    description: Prefixo de versao do contrato.

security:
  - tokenConsumidor: []

paths:
  /health:
    get:
      summary: Liveness do servico
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Servico no ar.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /analisar:
    post:
      summary: Analisa um ponto (Relatorio Pontual Censitario 1.0 km)
      description: >
        Recebe uma coordenada {lat,lng} OU um link do Google Maps (maps_url) e retorna o estudo
        do ponto. Por padrao devolve JSON com KPIs; com formato=pdf (ou Accept: application/pdf)
        devolve o PDF de 7 paginas. Raio fixo 1.0 km (DEC-021). Importa, nao edita, a camada censo_*.
      operationId: postAnalisar
      parameters:
        - in: query
          name: formato
          required: false
          schema:
            type: string
            enum: [json, pdf]
            default: json
          description: Atalho de negociacao de conteudo (alternativa ao header Accept).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalisarRequest"
      responses:
        "200":
          description: Estudo do ponto (JSON com KPIs ou PDF de 7 paginas).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalisarResponseJSON"
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: >
            Coordenada invalida / maps_url nao parseavel / ponto fora do Brasil. Inclui
            o caso de ponto DENTRO do bounding box mas fora de qualquer municipio (ex.:
            offshore) -> codigo "coordenada_invalida".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente ou invalido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >
            Token valido sem permissao. RESERVADO: nao emitido nesta versao (sem escopos por
            consumidor; todo token valido tem acesso). Documentado para evolucao futura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Base geo ausente para a UF/municipio resolvidos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Falha de validacao Pydantic (corpo malformado; nem lat/lng nem maps_url).
            Usa o corpo PADRAO do FastAPI ({"detail": [<erros>]}), NAO o ErrorResponse
            {detail, codigo} — `detail` aqui e uma lista de erros de validacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
        "500":
          description: Erro interno ao gerar o estudo/PDF.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    tokenConsumidor:
      type: http
      scheme: bearer
      description: >
        Token de portador por consumidor/bot (Decisao 2). Nesta versao: lista estatica token->consumidor;
        evoluivel para Authelia/JWT. O consumidor resolvido e carimbado no JSON (rastreio LGPD).

  schemas:
    HealthResponse:
      type: object
      required: [status, environment]
      properties:
        status:
          type: string
          example: ok
        environment:
          type: string
          example: production

    AnalisarRequest:
      type: object
      description: Fornecer {lat,lng} OU maps_url. Raio e fixo 1.0 km (nao e parametro).
      properties:
        lat:
          type: number
          format: double
          example: -23.95
        lng:
          type: number
          format: double
          example: -46.33
        maps_url:
          type: string
          description: Link do Google Maps; parser puro extrai (lat,lng).
          example: "https://maps.google.com/?q=-23.95,-46.33"
        formato:
          type: string
          enum: [json, pdf]
          default: json
        rotulo:
          type: [string, "null"]
          description: >
            Nome do endereco/estabelecimento (opcional). Quando presente e nao for
            apenas "lat,lng", aparece na capa do PDF no lugar de "Coordenada: ...".
          example: "Pastel da Sueli - Av. Nossa Sra. do Loreto, 927"
      anyOf:
        - required: [lat, lng]
        - required: [maps_url]

    AnalisarResponseJSON:
      type: object
      description: KPIs derivados (READ-ONLY) do result de analisar_ponto_censitario_setores + carimbo de versao.
      required:
        - lat
        - lng
        - raio_km
        - metodo
        - versao_contrato
        - versao_score
        - gerado_em
      properties:
        lat:
          type: number
          format: double
        lng:
          type: number
          format: double
        raio_km:
          type: number
          format: double
          example: 1.0
        area_km2:
          type: number
          format: double
          example: 3.14
        metodo:
          type: string
          example: setor_censitario_intersecao_area_1km
        n_setores:
          type: integer
          example: 12
        pop_total_raio:
          type: [number, "null"]
          example: 18432.0
        renda_per_capita_media_raio:
          type: [number, "null"]
          example: 5210.0
        renda_media_domiciliar_raio:
          type: [number, "null"]
          description: >
            Renda domiciliar PRE-uplift (R$/mes por domicilio): renda per capita calibrada x
            moradores por domicilio, calculada POR SETOR (fallback para a coluna
            renda_responsavel_media_setor_2022) e so entao agregada ao raio por media ponderada
            por domicilios estimados -- no codigo equivale a renda do RESPONSAVEL (V06004).
            NAO e a soma da renda do raio, nem renda_per_capita_media_raio x moradores. O valor
            que o PDF/dashboard exibem para o MESMO ponto e renda_domiciliar_total_raio (com
            uplift + fator temporal), sensivelmente MAIOR que este.
          example: 15790.0
        renda_domiciliar_total_raio:
          type: [number, "null"]
          description: >
            Renda POR DOMICILIO (R$/mes) com o uplift de composicao SETORIAL e o fator
            temporal aplicados ("total" = renda do domicilio inteiro, nao so do responsavel).
            Tambem NAO e a soma da renda do raio; e a faixa exibida no choropleth
            renda_domiciliar do PDF. O example abaixo assume fator temporal 1,0 (fallback sem
            data/staging/fator_temporal_renda.json); em producao o fator temporal (~1,17)
            tambem multiplica.
          example: 25740.0
        domicilios_total_raio:
          type: [number, "null"]
          description: Domicilios particulares ocupados estimados no raio (soma ponderada por area).
          example: 6084.0
        metodo_renda_domiciliar_raio:
          type: [string, "null"]
          description: >
            Ponderacao usada: "ponderada_domicilios_estimados", "ponderada_populacao_ou_area"
            ou "ausente".
          example: ponderada_domicilios_estimados
        densidade_pop_raio_hab_km2:
          type: [number, "null"]
          example: 5870.0
        score_setor_medio:
          type: [number, "null"]
          example: 64.2
        score_setor_max:
          type: [number, "null"]
          example: 91.0
        n_concorrentes:
          type: integer
          example: 3
        n_ultra:
          type: integer
          example: 1
        versao_contrato:
          type: string
          example: api-geoespacial/v1
        versao_score:
          type: string
          example: score_setor_2022_calibrado
        gerado_em:
          type: string
          format: date-time
          example: "2026-06-10T12:00:00Z"
        consumidor:
          type: string
          description: Resolvido pelo token (rastreio do solicitante).
          example: bot-telegram

    ErrorResponse:
      type: object
      required: [detail, codigo]
      properties:
        detail:
          type: string
          example: Coordenada fora do Brasil
        codigo:
          type: string
          enum:
            - coordenada_invalida
            - nao_autenticado
            - sem_permissao
            - base_geo_ausente
            - erro_interno
          example: coordenada_invalida

    # Corpo PADRAO de validacao do FastAPI (resposta 422). Diferente do ErrorResponse:
    # `detail` e uma LISTA de erros e nao ha campo `codigo`.
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
          example: "Forneca {lat,lng} ou maps_url"
        type:
          type: string
          example: value_error
