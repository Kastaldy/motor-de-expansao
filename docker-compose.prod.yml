# docker-compose.prod.yml — Motor de Expansão Ultra Academia
#
# Serviços:
#   web        — piloto web (SPA + API FastAPI; sem porta no host, acessível via rede interna)
#   caddy      — reverse proxy com HTTPS automático via Let's Encrypt
#   authelia   — autenticação self-hosted com tela de login e suporte a 2FA opcional
#
# Pré-condições antes de `docker compose up`:
#   1. Copiar .env.example para .env e preencher os segredos
#   2. Preencher domínio real em Caddyfile e authelia/configuration.yml
#   3. Preencher usuários reais em authelia/users_database.yml
#   4. Garantir que /opt/motor-expansao/data/outputs/ existe e tem os parquets (~1,6 GB)
#   5. Garantir que /opt/motor-expansao/data/staging/ existe (parquets gitignored das
#      camadas paralelas; sem o bind, os overlays do Mapa Territorial somem em silencio)

services:

  # ── API GeoEspacial (on-demand, interna) ───────────────────────────────────
  # Container separado, mesma VPS/rede. Consome os MESMOS volumes de dados (:ro)
  # do servidor — nao tem copia propria. Sem porta no host: so o bot a consome
  # pela rede interna (http://api:8077). BLK-API-06. Requer dados em
  # /opt/motor-expansao/data/{outputs,staging,ibge,ultra} (ver docs/deploy_api_bot.md).
  api:
    # Modo PULL por digest (igual ao Streamlit): o CI (job publish-api) publica
    # `motor-expansao-api` no GHCR; a VPS pina por digest no .env. Fail-closed.
    #   API_IMAGE=ghcr.io/kastaldy/motor-de-expansao/motor-expansao-api@sha256:<digest>
    # Build local de dev/sanity: `docker build -f Dockerfile.api -t motor-expansao-api:local .`
    image: ${API_IMAGE:?defina API_IMAGE com o digest imutavel ghcr.io/kastaldy/motor-de-expansao/motor-expansao-api@sha256:<digest> — ver docs/deploy_api_bot.md}
    container_name: motor_expansao_api
    restart: unless-stopped
    # Teto anti-DoS (BLK-SEC-05): a API e internet-facing (api.ultra-expansao.tech, so
    # Bearer) e gera PDF pesado SINCRONO. Sem teto, um flood/retry esgotava a RAM da VPS
    # e derrubava o piloto junto. Com o limite, o container e OOM-killed e reinicia,
    # sem levar o host. `--limit-concurrency` faz o excedente receber 503 em vez de
    # enfileirar sem limite no unico worker.
    # 6g = ~2x o uso REAL medido no VPS (3.0 GiB em regime: cacheia a base de mercado
    # ~1,9 GB para o Relatorio Municipal). Da folga p/ o pico de um PDF sem OOM em uso
    # legitimo, e ainda barra um flood de tomar os 15 GiB do host. NAO baixar sem medir.
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 512
    command:
      - uvicorn
      - motor_expansao.api.main:app
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8077"
      - "--limit-concurrency"
      - "40"
    expose:
      - "8077"
    environment:
      API_ENVIRONMENT: "production"
      # token -> consumidor (JSON). Defina no .env, ex.: API_TOKENS='{"tok-bot":"bot-telegram"}'.
      API_TOKENS: ${API_TOKENS:?defina API_TOKENS no .env (JSON token->consumidor)}
      # JSON valido: pydantic-settings decodifica o campo de lista como JSON (um "*" cru quebra).
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["*"]}
      # Caminhos de dados EXPLICITOS: a imagem instala o pacote NAO-editavel, entao o
      # default de settings.py (parents[3]) resolveria para site-packages/data — errado.
      # Apontamos para /app/data/*, onde os volumes :ro abaixo montam os dados do host.
      API_CENSO_GEO_DIR: "/app/data/outputs/setores_censitarios_2022_geo"
      API_IBGE_DIR: "/app/data/ibge"
      API_STAGING_DIR: "/app/data/staging"
      API_ULTRA_DIR: "/app/data/ultra"
      API_COMPETITORS_LOGOS_DIR: "/app/concorrentes"
      # Chave do ArcGIS Location Platform p/ a vista aerea (satelite Esri) do PDF
      # (BLK-SAT-01/DEC-018). Opcional: sem ela a pagina de satelite e omitida e o
      # resto do PDF sai igual. Defina no .env do servidor: API_ARCGIS_API_KEY=...
      API_ARCGIS_API_KEY: ${API_ARCGIS_API_KEY:-}
      # Fundo de ruas dos PDFs pelo tileserver proprio (BLK-BASEMAP-02). MESMA URL INTERNA
      # que o servico `web` usa — os relatorios saem da mesma caixa e apontar para tileservers
      # diferentes so criaria divergencia visual. Opcional; sem ela cai no Voyager de antes.
      API_BASEMAP_TILES_URL: ${API_BASEMAP_TILES_URL:-}
      # Rotulos (nomes de rua/avenida/bairro) compostos POR CIMA do choropleth, do MESMO
      # tileserver — estilo `ultra-labels` (BLK-BASEMAP-06). Sem esta var NAO ha overlay e os
      # mapas de calor saem sem nome nenhum; nao ha mais fallback para o CARTO.
      #   API_BASEMAP_LABELS_URL=http://motor_expansao_tileserver:8080/styles/ultra-labels/{z}/{x}/{y}@2x.png
      API_BASEMAP_LABELS_URL: ${API_BASEMAP_LABELS_URL:-}
    volumes:
      - /opt/motor-expansao/data/outputs:/app/data/outputs:ro   # censo geo (obrigatorio)
      - /opt/motor-expansao/data/ibge:/app/data/ibge:ro          # malha municipal (obrigatorio)
      # Mercado/SAM + concorrentes/Ultra + os DOIS parquets de crescimento do passo 4
      # (`crescimento_municipal.parquet`, `crescimento_hex.parquet`). "Opcional" no
      # sentido de que a API sobe sem eles — mas o passo 4 do funil sai VAZIO e sem cor,
      # em silencio: `carregar_crescimento*()` devolve None quando o arquivo nao existe.
      # Eles nao vem na imagem (`.dockerignore` corta `data/`) nem no git
      # (`.gitignore`: `data/staging/*`); so chegam por este mount. Como sao gerados:
      # `data/reports/crescimento/README.md`. Conferir no ar: `GET /api/health`.
      - /opt/motor-expansao/data/staging:/app/data/staging:ro    # mercado/SAM + concorrentes/Ultra + crescimento (passo 4)
      - /opt/motor-expansao/data/ultra:/app/data/ultra:ro        # branding do PDF (opcional)
      - /opt/motor-expansao/concorrentes:/app/concorrentes:ro    # logos de pins (logo_<rede>.png)
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    # cap_drop ALL (BLK-SEC-05): uvicorn non-root na :8077 (porta alta) nao precisa de
    # capability nenhuma; dropar todas reduz a superficie se o processo for comprometido.
    cap_drop:
      - ALL

  # ── Bot Telegram (long-polling; consome a API por HTTP interno) ─────────────
  # Mesma imagem da API (inclui Google Chrome p/ o geocoder Selenium). Fala com o
  # Telegram por conexao de SAIDA (long-polling) -> nao precisa de porta publica e
  # roda 24/7 na VPS independente do PC. BLK-API-07.
  telegram-bot:
    # Mesma imagem da API (pull por digest via API_IMAGE no .env).
    image: ${API_IMAGE:?defina API_IMAGE com o digest imutavel da imagem motor-expansao-api — ver docs/deploy_api_bot.md}
    container_name: motor_expansao_telegram_bot
    restart: unless-stopped
    depends_on:
      - api
    command: ["python", "-m", "motor_expansao.api.telegram_bot"]
    environment:
      API_ENVIRONMENT: "production"
      API_TELEGRAM_TOKEN: ${API_TELEGRAM_TOKEN:?defina API_TELEGRAM_TOKEN no .env (token do @BotFather)}
      API_API_BASE_URL: "http://api:8077"
      # Token com que o bot se autentica na API; DEVE ser uma chave de API_TOKENS.
      API_API_CALL_TOKEN: ${API_API_CALL_TOKEN:?defina API_API_CALL_TOKEN no .env (chave existente em API_TOKENS)}
      API_BOT_SENHA: ${API_BOT_SENHA:?defina API_BOT_SENHA no .env (senha de acesso ao bot)}
      # Opcional: com chave usa Google Geocoding (rapido); sem chave o geocoder
      # por endereco usa Selenium/Chrome (primario) + Nominatim (fallback).
      API_GOOGLE_MAPS_API_KEY: ${API_GOOGLE_MAPS_API_KEY:-}
      API_BOT_SESSOES_PATH: "/data/bot_sessoes.json"
      # Relatorio de acessos (2026-08-18, trilha DEC-027): /acessos no bot, SO para
      # o chat de ops/alertas (mesmo id que o healthcheck usa). O envio automatico
      # 3/3h e' do cron do host (scripts/cron/run_relatorio_acessos.sh), nao do bot.
      API_ACESSO_LOG_DIR: "/app/logs/acesso"
      API_ACESSOS_ADMIN_CHAT_ID: ${MONITOR_TELEGRAM_CHAT_ID:-}
    volumes:
      - bot_data:/data
      # Trilha de acesso do piloto (DEC-027) em LEITURA — alimenta o /acessos.
      - /opt/motor-expansao/logs/acesso:/app/logs/acesso:ro
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true

  # ── Piloto Web (frontend Vite + backend FastAPI, num UNICO container) ────────
  # Serve o SPA (dist/) E a API na mesma porta 8899; o Caddy so faz reverse_proxy
  # (um bloco por subdominio), atras do Authelia. Consome os MESMOS volumes de
  # dados (:ro) do host. Sem porta no host. PILOTO: numeros da Viabilidade em
  # calibracao (rotulo "preliminar" na UI). READ-ONLY sobre o M1.
  web:
    # Modo PULL por digest (igual aos demais): o CI (job publish-web) publica
    # `motor-expansao-web` no GHCR; a VPS pina por digest no .env. Fail-closed.
    #   WEB_IMAGE=ghcr.io/kastaldy/motor-de-expansao/motor-expansao-web@sha256:<digest>
    # Build local de sanity: `docker build -f Dockerfile.web -t motor-expansao-web:local .`
    image: ${WEB_IMAGE:?defina WEB_IMAGE com o digest imutavel ghcr.io/kastaldy/motor-de-expansao/motor-expansao-web@sha256:<digest> — ver docs/deploy_piloto_web.md}
    container_name: motor_expansao_web
    restart: unless-stopped
    # DEC-022: teto herdado da funcao do streamlit (que tinha 10g/12g) — o web e o app
    # principal e carrega particoes de UF inteiras em memoria na 1a leitura.
    mem_limit: 8g
    memswap_limit: 10g
    expose:
      - "8899"
    environment:
      # O backend deriva OUTPUTS/STAGING/IBGE/ULTRA/CENSO_GEO/ENRICHED de MOTOR_DATA_DIR.
      MOTOR_DATA_DIR: "/app/data"
      WEB_DIST_DIR: "/app/web/dist"
      # DEC-023 — cadastro operacional das unidades (consultor, master franquia). E a
      # UNICA escrita do piloto, e por isso mora FORA do MOTOR_DATA_DIR: assim nenhum
      # artefato do M1 fica sob um mount de escrita e o guardrail READ-ONLY do backend
      # (test_backend_read_only_por_ast + test_leituras_nao_mutam_artefatos) continua
      # valendo sem excecao nenhuma. Sem o volume, a aba sobe igual, so sem as dimensoes
      # de cadastro (leitura degrada, escrita devolve 503).
      MOTOR_CADASTRO_DIR: "/app/cadastro"
      # Camada imobiliaria (2026-08-24). As duas envs sao EXPLICITAS de proposito: o
      # default do codigo resolveria o parquet para dentro do MOTOR_DATA_DIR (que existe)
      # mas o diretorio de dossies para o repo IRMAO do coletor (`../coleta-de-oportunidades`),
      # que NAO existe no container — e ai a aba subiria sem dossie nenhum, em silencio.
      #
      # Mount PROPRIO, e nao uma pasta dentro de `outputs`/`staging`, porque este e' o unico
      # artefato do piloto que vem de OUTRO REPOSITORIO (o coletor imobiliario) e tem cadencia
      # de coleta propria — misturar com os artefatos do M1 confundiria de quem e' a
      # responsabilidade de atualizar. Sobe por scp; ver docs/deploy_piloto_web.md.
      #
      # Sem o mount a aba responde 200 com lista VAZIA e a tela diz "Nada no recorte" — a
      # mesma frase de um filtro que nao casou. Por isso o artefato entrou no
      # `/api/health` (`artefatos.oportunidades_imobiliarias`): e' onde a falta vira sinal.
      #
      # O DOSSIE (PDF do coletor) carrega contato de corretor, e por isso a rota que o serve
      # e' a unica da camada restrita a aba `imobiliaria`; a LISTA e' agregada e sem PII, e
      # segue liberada tambem pela aba `mapa` (pins do Mapa Territorial).
      MOTOR_OPORTUNIDADES_PATH: "/app/data/oportunidades/viaveis.parquet"
      MOTOR_DOSSIES_DIR: "/app/data/oportunidades/dossies"
      # DEC-027 — trilha de acesso do piloto (quem fez o que): JSONL diario com
      # usuario (Remote-User do Authelia), IP real (X-Forwarded-For), rota+query,
      # status e latencia; retencao de 90 dias podada pelo proprio backend.
      # Mora FORA do MOTOR_DATA_DIR pelo mesmo motivo do cadastro (DEC-023):
      # nenhum artefato do M1 sob mount de escrita. Sem o volume, o app sobe
      # igual e a trilha degrada em silencio (1 aviso no stderr).
      MOTOR_ACESSO_LOG_DIR: "/app/logs/acesso"
      # Emenda DEC-027 (2026-08-19) — aba Acessos do piloto: allowlist de usuarios
      # (Remote-User do Authelia, separados por virgula) que podem ver o painel de
      # analytics da trilha. FORA do acesso_abas.json de proposito (sem curinga,
      # sem fail-open). Vazia/ausente = painel DESLIGADO para todos (404).
      # O valor vive no .env da VPS (ex.: MOTOR_ACESSOS_ADMIN_USUARIOS=felipe).
      MOTOR_ACESSOS_ADMIN_USUARIOS: ${MOTOR_ACESSOS_ADMIN_USUARIOS:-}
      # BLK-SAT-01: chave do ArcGIS Location Platform p/ a vista aerea (satelite) do
      # Relatorio Pontual. Sem a var -> render devolve None -> pagina omitida (PDF sai igual).
      API_ARCGIS_API_KEY: ${API_ARCGIS_API_KEY:-}
      # Fundo de ruas dos PDFs pelo tileserver proprio (BLK-BASEMAP-02, emenda DEC-004/011).
      # MESMA URL INTERNA que a `api` usa: a emenda diz, com todas as letras, que os
      # relatorios saem "da mesma caixa" e que apontar para tileservers diferentes so criaria
      # divergencia visual entre eles. Opcional; sem ela cai no CartoDB Voyager de antes.
      #   API_BASEMAP_TILES_URL=http://motor_expansao_tileserver:8080/styles/ultra-maptiler/{z}/{x}/{y}@2x.png
      #
      # CORRECAO DE DERIVA (2026-07-29): a producao JA passava esta variavel ao `web` — o compose
      # do servidor foi editado a mao e ficou A FRENTE do repo. Sem esta linha, restaurar o compose
      # versionado por cima do servidor DESLIGARIA o tileserver no piloto, em silencio (o PDF
      # continuaria saindo, pelo CartoDB). Conferido por diff do arquivo real do VPS.
      API_BASEMAP_TILES_URL: ${API_BASEMAP_TILES_URL:-}
      # Rotulos (nomes de rua/avenida/bairro) compostos POR CIMA do choropleth, do MESMO
      # tileserver — estilo `ultra-labels` (BLK-BASEMAP-06). Sem esta var NAO ha overlay e os
      # mapas de calor saem sem nome nenhum; nao ha mais fallback para o CARTO.
      #   API_BASEMAP_LABELS_URL=http://motor_expansao_tileserver:8080/styles/ultra-labels/{z}/{x}/{y}@2x.png
      API_BASEMAP_LABELS_URL: ${API_BASEMAP_LABELS_URL:-}
    volumes:
      - /opt/motor-expansao/data/outputs:/app/data/outputs:ro    # censo geo + enriquecido + base_calibracao
      # Idem ao servico acima: alem de mercado/SAM, concorrentes/Ultra e renda
      # domiciliar, este mount carrega os dois parquets de crescimento do passo 4.
      # Sem eles a camada "Como as cidades estao indo" fica vazia sem erro nenhum.
      # Conferir no ar: `GET /api/health` -> `artefatos.crescimento_*`.
      - /opt/motor-expansao/data/staging:/app/data/staging:ro    # mercado/SAM + concorrentes/Ultra + renda domiciliar + crescimento
      - /opt/motor-expansao/data/ibge:/app/data/ibge:ro          # malha municipal
      - /opt/motor-expansao/data/ultra:/app/data/ultra:ro        # branding do PDF
      - /opt/motor-expansao/concorrentes:/app/concorrentes:ro    # logos de pins (logo_<rede>.png)
      # Camada imobiliaria: `viaveis.parquet` + `dossies/` do coletor (outro repo, cadencia
      # propria). READ-ONLY como todo dado. Ausente = aba vazia SEM erro; confira no ar com
      # `GET /api/health` -> `artefatos.oportunidades_imobiliarias`.
      - /opt/motor-expansao/data/oportunidades:/app/data/oportunidades:ro
      # Mounts de ESCRITA do piloto — os UNICOS, ambos fora de /app/data de proposito:
      # cadastro (DEC-023) e trilha de acesso (DEC-027). Host: `chown 1000:1000` (appuser).
      - /opt/motor-expansao/cadastro:/app/cadastro:rw            # cadastro operacional (consultor etc.)
      - /opt/motor-expansao/logs/acesso:/app/logs/acesso:rw      # trilha de acesso (quem fez o que)
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    # cap_drop ALL (BLK-SEC-05): uvicorn non-root na :8899 (porta alta), sem necessidade
    # de capability. (Caddy/Authelia ficam de fora por ora — Caddy precisa bindar 80/443.)
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8899/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ── Caddy (reverse proxy + TLS automático) ─────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: motor_expansao_caddy
    restart: unless-stopped
    depends_on:
      - authelia
      - web
    ports:
      - "80:80"
      - "80:80/udp"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Access log do host piloto (DEC-027): a diretiva `log` do Caddyfile escreve
      # aqui (IP real, user-agent, latencia), com rotacao propria do Caddy.
      - /opt/motor-expansao/logs/caddy:/var/log/caddy
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true

  # ── Authelia (autenticação self-hosted) ────────────────────────────────────
  authelia:
    image: authelia/authelia:4.38
    container_name: motor_expansao_authelia
    restart: unless-stopped
    expose:
      - "9091"
    volumes:
      - ./authelia:/config
    environment:
      # Fail-closed (BLK-SEC-05): sem o segredo no .env o compose ABORTA, em vez de
      # subir o Authelia com segredo VAZIO (sessao/JWT forjaveis). Igual aos API_*.
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET:?defina AUTHELIA_JWT_SECRET no .env (openssl rand -hex 32)}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?defina AUTHELIA_SESSION_SECRET no .env (openssl rand -hex 32)}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?defina AUTHELIA_STORAGE_ENCRYPTION_KEY no .env (openssl rand -hex 32)}
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true

# ── Rede interna ───────────────────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge

# ── Volumes nomeados ───────────────────────────────────────────────────────────
volumes:
  caddy_data:
  caddy_config:
  bot_data:        # sessoes do bot (quem ja logou) — persiste entre restarts
